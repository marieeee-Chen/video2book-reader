# Formal publication consumes a reviewed frozen batch; no scheduled/live-main publication.
name: Verify frozen reader release
on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Run ID containing the frozen-release artifact
        required: true
        type: string
      release_id:
        description: Exact reviewed release ID
        required: true
        type: string
      build_sha256:
        description: Reviewed SHA-256 of build-manifest.json
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: frozen-release
          path: candidate
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify reviewed bytes and remotely verified input lock
        env:
          EXPECTED_RELEASE: ${{ inputs.release_id }}
          EXPECTED_BUILD_SHA: ${{ inputs.build_sha256 }}
        run: python scripts/verify-release.py candidate --require-remote
      - uses: actions/upload-artifact@v4
        with:
          name: verified-frozen-release
          path: candidate
          retention-days: 14
# Hosting activation remains a separate deployment decision after clean repositories exist.
# Local-only locks deliberately cannot pass this publication gate.
