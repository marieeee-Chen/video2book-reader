# Compile artifacts only. Installation/streaming/vault tests still require real devices.
name: Native build candidates
on: workflow_dispatch
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @app/desktop exec tauri build
        env:
          VITE_RELEASE_MANIFEST: ${{ vars.READER_RELEASE_MANIFEST }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned-candidate
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:mobile && pnpm --filter @app/mobile android:sync
        env:
          VITE_RELEASE_MANIFEST: ${{ vars.READER_RELEASE_MANIFEST }}
      - run: ./gradlew assembleDebug
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-candidate
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
